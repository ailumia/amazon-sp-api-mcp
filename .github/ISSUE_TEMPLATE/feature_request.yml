name: Feature request
description: Propose a workflow, runtime capability, or developer-experience improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request cannot be handled by the existing registry-driven invoke flow.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: Describe the durable user or developer problem, not only a proposed API.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Include relevant existing operations or tools.
  - type: textarea
    attributes:
      label: Compatibility and security considerations
